plugins {
    id 'java-library'
    id "io.github.0ffz.github-packages" version "1.2.1"
}

// Ensure the Java Library plugin features are explicitly ready to handle 'api'
java {
    withSourcesJar()
}

dependencies {
    // Core Engine Configurations
    api libs.jmeCore
    runtimeOnly libs.jmeJogg
    runtimeOnly libs.jmePlugins

    api libs.jmeEffects
    api libs.jmeTerrain
    api libs.jmeNetworking

    // Project Engine Extensions
    api libs.heart
    api libs.minie
    api libs.renthylcore
    api libs.renthyljme
    
    api libs.wes
    api libs.particlemonkey
    api libs.lemur
    api libs.lemur.proto
    implementation "org.jmonkeyengine:jme3-testdata:3.6.1-stable"
}